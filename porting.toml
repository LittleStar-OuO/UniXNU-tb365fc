schema_version = 1

[device]
name = "tb365fc"
soc = "MT6835"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad 12.1 (2025), Lenovo TB365FC, board cava_prc_consumer_wifi. The stock ZUXOS 1.1.10.122 package is unpacked and the unit itself has been inventoried over rooted adb (8 GB DRAM, 128 GB UFS, BOE HX83122B 1600x2560 @90 Hz, MT6631 combo); a self-built UEFI boot image reaches the UniXNU menu with the Advanced Logger viewer on hardware, while the DarwinBoot/XNU handoff is not verified yet."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["MT6835 platform identity, Lenovo TB365FC (cava_prc_consumer_wifi) board identity, iPad7,1 / iPadOS 17.7.11 build 21H461 target identity and the TB365FC bootstrap defconfig.", "Stock package ZUXOS 1.1.10.122 (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), hashed in proprietary-files.txt."]
configuration = ["board.soc = MT6835; board.soc_source = mt6835; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "tb365fc_defconfig enables the shared ARM DT platform, ARMCPU, architected timer, panic and prelinked crypto paths.", "feeds.toml points at the sibling UniXNU-mt6835-common checkout until a reviewed commit is published."]
procedure = ["Run ./unixnu defconfig tb365fc_defconfig -D ../UniXNU-tb365fc from a UniXNU checkout.", "Run ./unixnu status --json -D ../UniXNU-tb365fc and inspect the effective SoC layer and source pins."]
findings = ["The device identifies as MT6835 with stock board name cava_prc_consumer_wifi, Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828.", "The stock SP Flash Tool package provides boot, init_boot, vendor_boot, dtbo, lk and preloader images; their hashes and the values derived from them are recorded across the firmware, cpu, memory, storage, display, input, gpu, network, audio, power and packaging areas.", "No public Lenovo kernel source or DTS for this board was found; every hardware value so far comes from the stock firmware and the live device inventory.", "The unit reports ro.product.device TB365FC, ro.product.name TB365FC_PRC, ro.board.platform mt6835 and ro.boot.hardware mt8755 on Android 15 build AP3A.240905.015.A2/250828_122 (kernel 5.15.170), with ro.boot.verifiedbootstate orange and ro.boot.flash.locked 0."]
completion = ["Source pins resolve, the effective configuration contains the intended TB365FC overrides and every selected component has an owning area."]
limits = ["The active panel variant, the APFS Data volume UUID, the LK acceptance of a self-built boot image and the FD base are still unverified; example stays true until the firmware boots."]
next_action = ["Build the first UEFI FD, confirm the boot path on hardware and only then clear example = true and fill the remaining REQUIRED values."]
evidence = [
  { kind = "device", reference = "tools/collect-device-info.sh", command = "tools/collect-device-info.sh", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Collected the redacted identity and hardware inventory that the areas below now cite." },
]

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "tools/**", "README.md"]
inputs = ["Stock TB365FC firmware package (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), unlocked bootloader state, fastboot mode, the stock boot/vendor_boot/dtbo partitions and the UEFI firmware from uefi-tb365fc.", "Measured boot geometry: boot.img header v4 (4096-byte pages); vendor_boot header v4 with kernel_addr 0x40000000, ramdisk_addr 0x66F00000, tags_addr/dtb_addr 0x47C80000 and cmdline \"bootopt=64S3,32N2,64N2\"."]
configuration = ["Plan A (device-verified to the menu): a self-built header v4 boot image with kernel = gzip(UEFI FD) at the stock kernel_addr 0x40000000; Plan B fallback: Linux preboot hot-jump as documented by camellia.", "Resources/Configs/tb365fc.toml sets base 0x40000000, size 0x400000, header_version 4, kernel_compression gzip and append_dtb false; a v4 header stores no load addresses, so LK's own kernel_addr selects the FD base.", "Firmware paths in board.toml [firmware] point at Platforms/Lenovo/tb365fcPkg and Build/tb365fcPkg in the uefi-tb365fc checkout."]
procedure = ["Extract the stock boot, vendor_boot and dtbo partitions and read them with tools/unpack_boot_image.py and tools/extract_fdt.py.", "Build the UEFI FD, flash the boot image, and record the first screen, last confirmed stage and log source."]
findings = ["init_boot.img is header v4 with a 2,066,170-byte ramdisk; vendor_boot.img is header v4 with vendor_ramdisk_size 27,731,435 and dtb_size 190,500.", "dtbo.img holds one 240,233-byte DTBO with 208 fragments; the vendor_boot DTB is the MT6835 base tree (model \"MT6835\") and the overlay targets use unresolved 0xffffffff phandles until LK merges them.", "lk.img (2,897,568 bytes) carries kernel_load_addr and dtb_addr as runtime variables rather than text-form constants; the few 32-bit words equal to 0x40080000 have no established role. Hardware later confirmed the v4 path: LK loaded gzip(FD) at 0x40000000 and reached the UniXNU menu, so the FD base is measured rather than a convention.", "A self-built v4 boot image carrying gzip(4 MiB FD) with no BootShim, no appended DTB and a 1 MiB FAT12 ramdisk booted from boot_a to the UniXNU menu with the Advanced Logger viewer (diag9), so the stock LK accepts this header and load path; whether LK also publishes the v4 boot ramdisk at 0x66F00000 is still unverified.", "The stock boot images are padded to their partition sizes (boot and vendor_boot 64 MiB, init_boot and dtbo 8 MiB); the hashes in proprietary-files.txt cover the padded files.", "On the tablet the boot, vendor_boot and dtbo images match the pinned stock hashes, and /proc/iomem reserves the header addresses: dtb at 0x47c80000 and the ramdisk at 0x66f00000-0x68be2fff.", "init_boot_a does not match the pinned stock hash: the unit runs SukiSU Ultra in LKM mode (a kernelsu module is loaded and the stock kernel carries no KernelSU strings), so the pin still describes the package, not this unit's rooted boot partition.", "The stock cmdline carries fastboot_enable=1 and bootopt=64S3,32N2,64N2; neither demonstrates fastboot boot support."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["LK's acceptance of a self-built v4 image is verified from boot_a, but whether it places the boot ramdisk at 0x66F00000 and publishes /chosen linux,initrd-start/end (needed to feed the payload to DarwinBoot) is unverified; the fastboot boot path is also untested."]
next_action = ["Flash the payload-bearing v4 boot image to boot_a with the owner present and capture /proc/pl_lk and console-ramoops to confirm the ramdisk handoff into BootRamdiskDxe."]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "SHA-256 pins for the stock boot, init_boot, vendor_boot, dtbo, lk and preloader images this area derives its geometry from." },
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Parsed the stock boot, init_boot and vendor_boot headers; produced the header versions, sizes and load addresses recorded above." },
  { kind = "device", reference = "proprietary-files.txt", command = "sha256sum stock/boot_a.img stock/vendor_boot_a.img stock/dtbo_a.img stock/init_boot_a.img", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "boot_a, vendor_boot_a and dtbo_a match the pins; init_boot_a differs because of the SukiSU LKM patch." },
]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/**", "configs/**", "patches/**"]
inputs = ["Measured from the stock vendor_boot DTB: 6x Cortex-A55 at MPIDR affinities 0x0-0x500, 2x Cortex-A76 at 0x600-0x700, GIC distributor 0x0C000000 (256 KiB), redistributors 0x0C040000 (2 MiB) and a 13 MHz architected timer."]
configuration = ["CONFIG_XNU_ARMCPU=y and CONFIG_XNU_ARM_DT_PLATFORM=y.", "dts/mt6835.dtsi carries the measured cluster layout, the PSCI conduit and the GIC ranges; tb365fc.dts enables the CPUs."]
procedure = ["Compare dts/mt6835.dtsi with the stock FDT /cpus, interrupt-controller and timer nodes.", "After the first boot, check the PSCI conduit and per-CPU bring-up against /proc/cpuinfo and the stock dmesg."]
findings = ["The stock topology is one GICv3 domain: A55 at affinity 0x0 and 0x100-0x500 (cluster type E), A76 at 0x600/0x700 (cluster type P). The earlier MT6833-style 0x0-0x1 / 0x100-0x105 guess was wrong.", "The architected timer runs at 13 MHz (clock-frequency 0xc65d40), and GICD spans 0x40000 bytes rather than 64 KiB.", "The stock tree has a /psci node (compatible arm,psci-1.0, method smc) and every CPU uses enable-method = \"psci\"; the dtsi conduit matches it.", "The stock tree uses four-cell interrupt specifiers whose trailing cell is a MediaTek wakeup flag; the ADT keeps the standard three-cell GIC form.", "The on-device /proc/cpuinfo lists 8 CPUs: six 0xd05 (Cortex-A55) and two 0xd0b (Cortex-A76), matching the DTB affinities."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["SMP is not enabled in UniXNU; the PSCI conduit and cluster types are untested there, although Android already runs all eight cores."]
next_action = ["Boot the first CPU on hardware, confirm the PSCI conduit, then enable the remaining cores one cluster at a time."]
evidence = [
  { kind = "device", reference = "dts/tb365fc.dts", command = "adb shell cat /proc/cpuinfo", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Core count and part numbers (0xd05 x6, 0xd0b x2) match the cluster layout in the device tree." },
]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "tools/**", "patches/**"]
inputs = ["DRAM base and size, reserved-memory carveouts and the IOMMU/SMMU stream inventory.", "The stock tree declares CMA pools (ssmr and ssheap, 256 MiB each, 16 MiB/2 MiB alignment) and dynamic carveouts whose final addresses are assigned by LK."]
configuration = ["tb365fc.dts must expose exactly one enabled memory node with one contiguous range; the shared ADT generator rejects anything else.", "Reserved regions stay outside the contiguous DRAM range reported to XNU."]
procedure = ["Read the stock DTB memory and reserved-memory nodes and reconcile them with /proc/iomem and /proc/meminfo on the rooted device.", "Regenerate the ADT and confirm chosen/dram-base and dram-size match the extracted values."]
findings = ["The stock DTB memory node is a 1 GiB stub at 0x40000000 (0x0 0x40000000 0x0 0x40000000) that LK replaces at boot, so the DRAM size cannot be read from the DTB.", "Measured on the tablet: MemTotal is 7,991,068 kB, CmaTotal 737,280 kB, and /proc/iomem maps DRAM from 0x40000000 to 0x23fffffff, confirming the 8 GiB range in tb365fc.dts.", "The live map reserves 0x47c80000-0x47ce6fff (DTB), 0x66f00000-0x68be2fff (vendor ramdisk) and a large block from 0x20888f000 to 0x23e5fffff; the ADT must keep such ranges out of the region handed to XNU."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The reserved ranges are LK-assigned and this is Android's post-LK view, not a UniXNU handoff contract; the final carveouts remain unknown."]
next_action = ["Regenerate the ADT once the UEFI FD runs and diff its memory map against this inventory."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the base DTB from the stock vendor_boot image and dumped its memory and reserved-memory nodes." },
  { kind = "device", reference = "dts/tb365fc.dts", command = "adb shell cat /proc/meminfo; adb shell su -c cat /proc/iomem", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "MemTotal and the System RAM interval 0x40000000-0x23fffffff confirm the 8 GiB memory node." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["package/**", "patches/**", "tools/**"]
inputs = ["Storage host candidates in the stock DTB: ufshci@112b0000 (\"mediatek,mt8183-ufshci\", reg 0x112b0000/0x2300, IRQ 0x189) is enabled, while mmc@11230000 (\"mediatek,mt6835-mmc\", reg 0x11230000/0x10000 + 0x11e70000/0x1000, IRQ 0x183) and mmc@11240000 are explicitly disabled.", "Stock scatter: boot_a 0x28F00000, vendor_boot_a 0x2CF00000, init_boot_a 0x30F00000, dtbo_a 0x31700000, super 0x4B000000 (0x2C0000000 bytes), userdata at byte 0x34C800000 in both the EMMC and UFS layout.", "The userdata partition geometry and the Data volume UUID."]
configuration = ["[userdata] first_lba = 0x34C800, last_lba = 0x1DC8FF7 and lba_bytes = 4096 come from the on-device GPT; the APFS Data volume UUID is still REQUIRED.", "A storage component is selected only after the host-controller inventory; no storage gate is enabled in tb365fc_defconfig yet."]
procedure = ["Read /proc/partitions, the GPT (sgdisk -p on the boot LUN: /dev/block/sda* for UFS or /dev/block/mmcblk0* for eMMC) and the queue/logical_block_size on the rooted device.", "Record the userdata entry LBA range and the APFS volume UUID used for root matching."]
findings = ["The stock DTB enables a UFS host (ufshci@112b0000) and disables both MSDC hosts; the dtbo also carries the mt6377_vufs rail. The earlier \"eMMC on MSDC_0\" reading came from the scatter's first layout section and is not established.", "The scatter is a download map, not the GPT: its pgpt entry is NONE and the userdata size 0xC0000000 is the factory image, so the real partition may extend further.", "Measured on the tablet: the UFS host 112b0000.ufshci drives a Samsung KLUDG2R1JF-B0F1 LUN with 4096-byte logical sectors; /dev/block/sdc reports 249,921,536 512-byte sectors (127.96 GB) and a 71-entry GPT.", "GPT entries: userdata 0x34C800-0x1DC8FF7 (111,091,680 KiB), boot_a 0x28F00 and vendor_boot_a 0x2CF00 (64 MiB each), init_boot_a 0x30F00 and dtbo_a 0x31700 (8 MiB each), super 0x4B000 (11 GiB); the init_boot_b entry is 11,776 KiB, an asymmetry in the factory table.", "The LK log reports the UFS link as \"HS-G3-2, 1 lane\"."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["UniXNU's firmware has no UFS driver (MsdcDxe is the only storage path) and the SMMU stream wiring is unknown; the Data volume UUID cannot be set until APFS is installed."]
next_action = ["Port a UFS host path into the firmware, then record the GPT and the Data volume UUID once APFS is installed."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Identified the enabled UFS host, the disabled MSDC hosts and their register windows in the stock base DTB." },
  { kind = "device", reference = "tools/pull-stock-images.sh", command = "adb shell su -c 'dd if=/dev/block/sdc bs=4096 count=34' with a local GPT parse", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "GPT at 4096-byte sectors: the userdata LBA range and the A/B boot partition sizes match the board.toml [userdata] values." },
]

[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["DSI panel variant from the stock overlay: panel1@0 \"boe,hx83122b,vdo\" or panel2@1 \"tm,nt36532,vdo\", both video-mode with TE.", "Panel rails and GPIOs: power enable GPIO 0x22, backlight enables 0x15/0x19, reset GPIO 0x56 (86), bias GPIOs 0x7c (124) and 0x97 (151).", "Backlight controllers ST7758 and AW99706 at I2C addresses 0x2e and 0x76 on two panel channels.", "Panel resolution, refresh rate and init sequence from the vendor LCM driver; the device tree carries no timings."]
configuration = ["Bootstrap relies on the firmware GOP framebuffer only; no XNU display provider is selected yet."]
procedure = ["Record the active panel compatible, wm size and wm density on the tablet and match them with the stock LCM driver name from the LK/kernel log.", "Record the GOP mode from the UEFI boot log when the first firmware image runs."]
findings = ["The board ships with either a BOE HX83122B or a Tianma NT36532 video-mode panel using the same rails, reset and TE wiring.", "Measured on the tablet: 1600x2560 at 90.00 Hz with a physical density of 249.46 dpi (ro.sf.lcd_density 320), so the panel is portrait 1600x2560.", "Both panel1@0 and panel2@1 stay enabled in the live merged FDT; LK picks the variant at runtime from the panel ID.", "The LK log (/proc/pl_lk) names the active driver: lcm_compare_id matches \"hx83122b_boe AF\" and LK uses \"cava_hx83122b_boe_vdo_cphy_dsc_90hz_lcm_drv\" (BOE HX83122B, video mode, CPHY, DSC, 90 Hz) with fps=9009.", "The same log reads the backlight ids: AW99706 answers on I2C 0x76 with id 0x7 while ST7758 returns 0, so this unit uses the AW99706 controller on both channels."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["The DSI timing parameters and init sequence still live inside the vendor LCM driver, and the GOP mode is unknown."]
next_action = ["Extract the DSI timings and init sequence for cava_hx83122b_boe_vdo_cphy_dsc_90hz_lcm_drv, then record the GOP mode when the firmware first runs."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock dtbo overlay that declares both panel variants, their rails and the backlight controllers." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell dumpsys SurfaceFlinger | grep activeMode", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Active mode 1600x2560 at 90.00 Hz, dpi 249.46, matching wm size and ro.sf.lcd_density 320." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell su -c cat /proc/pl_lk", revision = "ce3fb214d55f674ef937781e076c8f8f36ed08a5", result = "LK log names the selected BOE HX83122B LCM driver, reports fps 9009, and identifies AW99706 as the backlight controller." },
]

[[area]]
id = "input"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["Touch over SPI at 10 MHz (0x989680) with spi-cpha: IRQ GPIO 4 (active low), reset GPIO 43 (0x2b), dual driver set himax,hxcommon and novatek,NVT-ts-spi, Novatek 40x64 node grid (mp-criteria-6096).", "Pogo keyboard node \"lenovo,lenovo_keyboard\" and MT6377 PMIC keys."]
configuration = ["Input components are selected only after the SPI bus and GPIO inventory; no input gate is enabled yet."]
procedure = ["Read the stock overlay touch/keys nodes and /sys/class/input on the rooted device.", "Record which touch firmware variant the unit actually runs and the pogo keyboard protocol."]
findings = ["Touch is a Himax/Novatek SPI part on IRQ GPIO 4 with reset on GPIO 43.", "A Lenovo pogo keyboard and MT6377 PMIC keys (power, volume) are present.", "Measured on the tablet: /dev/input exposes himax-touchscreen (event2), lenovo-stylus (event3), mtk-kpd (event1), mtk-pmic-keys (event0), hall_irq (event5) and the MT6377 headset jack (event4); the Himax driver is the one bound on this unit."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["The pogo keyboard was not attached during collection, so its protocol and the key map are unverified; the stylus HID descriptor is not recorded yet."]
next_action = ["Attach the pogo keyboard, record its input device and key map, then map the touch range 16000x25600 onto the panel."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock overlay touch node with its SPI frequency, GPIOs and driver compatibles." },
  { kind = "device", reference = "dts/tb365fc.dts", command = "adb shell getevent -pl", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Input devices match: himax-touchscreen, lenovo-stylus, mtk-kpd, mtk-pmic-keys, hall_irq and the headset jack." },
]

[[area]]
id = "gpu"
status = "in-progress"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["Valhall GPU at 0x13000000 (\"mediatek,mali\", \"arm,mali-valhall\"), five interrupts 0x10D-0x111 (GPU/MMU/JOB/EVENT/PWR), OPP table and GED supply from the stock base DTB.", "Live FDT: register window 0x13000000+0x4000, operating-points-v2 phandle 0x32 (1.1 GHz to low OPPs with microvolt levels), ged-supply phandle 0x33, gpufreq supplies (gpufreq_wrapper, _vgpu), and the GPUEB shared block at 0x7E480000+0x180000 with gpueb-support = 0.", "Lenovo ZUI factory package TB365FC_ZUXOS_1.1.10.122 (2025-08-28): super.img is an Android sparse image (7,797,659,468 B) whose LP metadata v10.2 has 3 slots, metadata_max 65536 and 14 partitions on one 11,811,160,064 B block device; vendor_a (519,061,504 B) and vendor_dlkm_a (13,103,104 B) are EROFS."]
configuration = ["No GPU component is selected; the bootstrap image does not initialize the GPU."]
procedure = ["Record GPU registers, power and clock inputs from the stock DTB before selecting an accelerated frontend.", "Match the GPU generation and OS ABI, then adapt power/firmware, memory/command submission and Metal staging in the order of the official GPU page."]
findings = ["The stock tree places the GPU at 0x13000000 with GPU/MMU/JOB/EVENT/PWR interrupts and an operating-points table.", "GPU bring-up is deferred until XNU reaches IOKit initialization.", "XNU now reaches userland and real frames reach the panel (display-backend area), which is the prerequisite the GPU page names before GPU work.", "The mali node declares no iommus property; the GPU memory path is the MTK SMMU/EMI layout and must be recovered from the stock driver and DTB reservations, not from a generic IOMMU binding.", "SpringBoard exits with SIGABRT while the display client still presents; the GPU page's Metal backend (kernel backend plus Metal frontend) is the open blocker for the UI.", "The factory package yields the whole GPU stack. vendor_dlkm carries mali_kbase_mt6835.ko (2,166,856 B, ARM Mali kbase r38p1 Valhall with MTK mt6835 glue; its strings cite vendor/mediatek/kernel_modules/gpu/mt6835/mali_valhall/mali-r38p1), mali_mgm_mt6835.ko, mali_prot_alloc_mt6835.ko, ged.ko, gpueb.ko, mtk_gpufreq_mt6835.ko, mtk_gpufreq_wrapper.ko, mtk_gpu_qos.ko, mtk_gpu_hal.ko and met_gpu_api.ko. vendor carries libGLES_mali.so, vulkan.mali.so, arm.mali.platform-V1-ndk.so and the arm.mali.platform-service.", "No external Mali firmware blob exists for this GPU: kbase's request_firmware/release_firmware imports belong to the shared CSF code paths, the module embeds no firmware name, and the DTB mali node has no firmware-name; G57 is a Valhall JM part, which runs without an MCU firmware image (matching Panfrost's G57 support).", "The vendor modules keep local symbols, so the stock power sequence is recoverable: mtk_gpufreq_mt6835.ko exports __gpufreq_power_control (buck -> clock -> mfg0..3 -> MFG_TOP_CONFIG), __gpufreq_clock_control, __gpufreq_mfg0..3_control and __gpufreq_buck_control with MFG0-3 PWR_STATUS logging.", "SPM (sleep@1c001000) carries the MFG0..3 PWR_CON registers at 0xeb8/0xebc/0xec0/0xec4 with power-good bits 1..4 in PWR_STATUS 0xf4c and PWR_STATUS_2ND 0xf50; each domain releases reset/isolation (bits 2,3), waits for power-good, clears clock-disable (bit 4) and PWR_ON_S (bit 1), raises PWR_ON (bit 0), then clears bit 8 and waits for bit 12 to fall. MFG0 adds INFRA_AO (0x10001000) writes 0xc48=0x200 and 0xca8=0x10; MFG1 adds 0xca8=8/4/2/1, 0xc68=0xc0000 and 0xc58=0x100000.", "The GPU root clock is topckgen 0x10000000: mfg_pll_sel (id 0x39) at 0x120 bit 16 selects parent 0 = mfg_ref_sel_ck or parent 1 = mfgpll_ck with set/clr at 0x124/0x128; mfg_ref_sel (id 0x36) at 0xe0 bits 17:16 selects among tck_26m_mx9_ck, mainpll_d6_d2, mainpll_d6 and mainpll_d5_d2; the mfgcfg_bg3d gate (id 0) at MFG_CFG 0x13fbf000 uses the MTK set/clr layout confirmed by mainline clk-mt8183-mfgcfg: status at +0x0 (bit 0 reads 0 when enabled), SET +0x4 disables, CLR +0x8 enables, shift 0, with mfg_ref_ck as parent.", "The post-domain MFG_TOP_CONFIG (0x13fbf000) sequence is +0x20 |= 0x3c00000, +0xb0 &= ~0x600, +0xb4 |= 0x10, +0xb0 = (old & 0x80000) | 0xfff7feff, +0x24 |= 1, +0xf60 |= 1, then 0x8a0/0x8a8/0x8c0/0x8c8 = 0x0808ff81 and 0x8b0/0x8b8/0x8d0/0x8d8 = 0x4040ff81. The VGPU buck is only set through PMIC regulator calls, so a cold rail can fail the power-good poll; diag155 therefore stops before any GPU register read unless all four domains report up.", "diag155 adds NativeMali.cpp: it maps topckgen, INFRA_AO, MFG_CFG, SPM and the GPU block, logs the pre/post state, runs the extracted sequence with bounded polls, and reads GPU_ID/L2/MEM/MMU/JS/SHADER_PRESENT only after the status and gate checks pass.", "diag155 on the tablet read the pre-state cleanly (top=0xff000000, ref=0x01020100, PWR_STATUS/2ND=0x000ffe01, all MFG0-3 off) and panicked with \"Unhandled implementation specific error\" at the first MFG_CFG write, before any domain was powered. The stock call order is actually buck -> mfg0 -> mfg1 -> reference clock enable -> mfg2 -> mfg3 -> clock_control -> MFG_TOP_CONFIG, so MFG_CFG belongs after the INFRA_AO bus-protection writes; diag156 moves every MFG_CFG access behind the four-domain power-good check.", "The bg3d gate follows mfg_cg_regs {set 0x4, clr 0x8, sta 0x0}: is_enabled reads sta bit 0 and treats 0 as enabled; enable writes 1 to 0x8 and disable writes 1 to 0x4, so diag156's read of 0x4 was the write-only set register, not a status. The mfg_ref_sel mux gate at topckgen 0xe0 bit 23 reads 0 (enabled) at boot, so the reference branch (mainpll_d6) is alive before any clock write; only MFGPLL selection would need the clock driver.", "diag157 on the tablet completed the whole probe with no panic: d176 read MFG_CFG 0x0-0x1c as zeros except 0x10, and the gate toggle proved the polarity (g0=0, g1=0 after CLR, g2=1 after SET, g3=0 after CLR again). d179 logged the post-init MFG_TOP_CONFIG values (0x20=0x03e00000, 0xb0=0x00687e03, 0xb4=0x10, 0x24=0x7, 0xf60=1, 0x8a0=0x0000ff81) and d180/d181 read the Mali identification registers: GPU_ID=0x90930010 (Valhall, product 0x9093 = Mali-G57), L2=0x00120206, MEM=0x00000001, MMU=0x00002830 (VA 48, PA 40), JS=0x00000007, SHADER_PRESENT=0x00000005/0x00000000 (two shader cores, matching MT6835's G57 MC2), STATUS 0x34=0, features 0x60/0x64=0/0. The boot continued into the root wait and userland path after the probe, so GPU register access from XNU is stable.", "diag158 ran the first GPU job test: reset/power-on latched, JS0 accepted head/tail 0x100000 with JS_CONFIG 0x83700, but the job never completed (JOB_INT_RAWSTAT=0, target stayed 0xdeadbeefcafef00d) and AS_FAULTSTATUS read 0x7c0002cb - access type READ, slave-fault bit clear, i.e. the GPU's read of the job descriptor or a translation table was aborted below the Mali MMU. The fault page was not written, so this is an MMU-level fault rather than a job exception. The probe lines before the 2 s poll were overwritten by the UFS watch burst (16 submits) which ends before the quiet window; the tail lines survived. Next: diag159 repeats the attempt with five AS configurations (PTW WB/NC, MEMATTR WB/NC, identity mode, START_MMU off), re-resetting the GPU between attempts and logging AS_FAULTADDRESS plus GPU fault registers after each.", "diag159 succeeded on its first attempt with the Mali LPAE page-table format: after a soft reset the L2/shader/tiler groups came ready (READY 0x1/0x5/0x1), AS0 was programmed with TRANSTAB=PA|0x7, TRANSCFG=0 (legacy), AS_MEMATTR=0x008D0888 and last-level block PTEs (PA|0x2C1, HAP RW, no AF) and the WRITE_VALUE(ZERO) job on JS0 completed: JOB_INT_RAWSTAT=1, JS_STATUS=0, JS_HEAD=0x100000, AS_FAULTSTATUS=0, GPU fault registers 0, and the target page went from 0xdeadbeefcafef00d to 0. This is the first GPU job executed from XNU; the earlier fault was the AArch64-4K descriptor/TRANSTAB/TRANSCFG encoding, which G57 does not use with kbase. Remaining attempts in the matrix were skipped because attempt 1 passed.", "diag160 tried the reusable shape (one init, six VA pages including one 32 KiB past the JD, and two two-job chains resubmitted on JS0 without a reset). Both chains failed at job-slot level: JOB_INT_RAWSTAT error bit 16 set, JS_STATUS=0x50, JS_STATUS head/tail read back 0, AS_FAULTSTATUS=0, GPU fault registers 0, and all targets stayed 0xdeadbeefcafef00d - so the JM rejected the chains before any job executed, likely on descriptor/chain configuration rather than memory translation. diag161 reruns a differential matrix on the same image shape: single write-value baseline, two write-value jobs chained without dependencies, the same chain with dependency 2=1, write-value -> null, null -> write-value, and a two-job chain whose second header sits on a separate page, logging RAWSTAT, JS_STATUS, head/tail and fault registers for each so the failing feature is isolated."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["The MTK kbase mt6835 glue source and the gpufreq/gpueb register sequences are not in this tree; the factory package provides the binary modules and the DTB, not the source.", "UniXNU's reviewed Metal path is Adreno740 + AdrenoMetal/Turnip/metal2vulkan; there is no reviewed Valhall kernel backend, no Darwin-hosted Vulkan driver for Mali, and Metal itself has no Mali backend, so the GPU page's step 1 gate is not yet satisfied.", "The stock userspace GPU blobs are Android bionic binaries and cannot be reused under Darwin."]
next_action = ["The userspace half now builds without a Mac: Mesa 26.2 at pin 85fda3b cross-builds libvulkan_panfrost.dylib for arm64 iOS 17 with the community iPhoneOS17.5 SDK plus clang-19/lld-19 and native mesa_clc/panfrost_compile, using the Darwin patch set in package/mesa-ios-panvk.patch (entrypoint weak_import, vk_image drm_format_mod on Apple, ld64 -undefined dynamic_lookup, per-arch Darwin guards). package/NativeMaliABI.h is the shared v2 wire ABI (BO alloc with VA and mmap offset, GET_PARAM, user mmap via clientMemoryForType); gpu/libdrm/native_drm.c is the libdrm shim translating Panfrost UAPI and DRM syncobjs onto NativeMaliUserClient, with open/stat/mmap interposition. The kernel archive already compiles with the v2 user client. Next: build a userland probe (BO mmap plus chain submit through the shim), package the dylib and a basic ICD json into the gpu addon, run it on device, then wire the NativeMaliMetal plugin."]
evidence = [
  { kind = "source", reference = "Stock live FDT (device-data/tb365fc-root-20261028-144622/stock/fdt/live/fdt-00.dtb, dtc -f -I dtb -O dts)", result = "mali@13000000 has reg 0x13000000+0x4000, IRQs 0x10D-0x111 named GPU/MMU/JOB/EVENT/PWR, operating-points-v2 phandle 0x32, ged-supply 0x33, and no iommus property; gpufreq and gpueb (0x7E480000+0x180000, gpueb-support=0) are separate nodes." },
  { kind = "source", reference = "Lenovo TB365FC_ZUXOS_1.1.10.122 super.img (7,797,659,468 B, Android sparse) expanded with simg2img and split with a liblp parser (geometry at 4096, metadata slot 0 at 12288, metadata_max 65536, fixed LpMetadataPartition/Extent/Group/BlockDevice structs) plus fsck.erofs", result = "vendor_dlkm_a (13,103,104 B, EROFS, sha256 2860d111d399a61e6a5893c4622b95f4bb44182070d6dd231d8f11364c49da33) yields mali_kbase_mt6835.ko (2,166,856 B, sha256 49f70fb51a015e07c9ae7eb2fa863fed2a934a33be54c955e0e5078dc3e22c8a; Mali kbase r38p1 Valhall, MTK mt6835 glue), ged.ko (sha256 f708e8055345bafecdbf4a1fa3dbd8ec096e96b730825cf0d949523bfe41fac8), gpueb.ko (sha256 fc165c1f75c8af58f94036619b46b125532a039cb258f349f2392443633b2fd0), mali_mgm_mt6835.ko, mali_prot_alloc_mt6835.ko, mtk_gpufreq_mt6835.ko, mtk_gpufreq_wrapper.ko, mtk_gpu_qos.ko, mtk_gpu_hal.ko and met_gpu_api.ko." },
  { kind = "source", reference = "Same package, vendor_a (519,061,504 B, EROFS)", result = "Carries the userspace GPU stack: lib64/egl/mt6835/libGLES_mali.so (42,397,352 B), lib64/hw/mt6835/vulkan.mali.so (10,368 B), arm.mali.platform-V1-ndk.so, the arm.mali.platform-service binary and etc/mali_platform.config." },
  { kind = "device", reference = "diag155-vendor_boot.img (sha256 be24b362e2ccbd1743836b6bc3808be945065e0e2f3e786a157ed724bb32ce41) on TB365FC", result = "d172 printed top=0xff000000 ref=0x01020100 spm=0x000ffe01/0x000ffe01 con=all zero, then the first MFG_CFG write panicked with \"Unhandled implementation specific error\"; the framebuffer console captured the panic and the SPM/topckgen reads prove both blocks were reachable before power." },
  { kind = "device", reference = "diag157-vendor_boot.img (58920960 bytes, sha256 633919610be3b17dd575a99d341ac08c8f728318a0907aa9e7708e33120cb07c) on TB365FC", command = "fastboot flash vendor_boot_a diag157-vendor_boot.img; boot; 1 fps screen capture", revision = "diag157 kernel sha256 192eb5d3916da89b0e3e6603fa3511ce801fde8badfef516db318e261d66aad7", result = "d172-d181 all printed: four domains powered (d174 mfg0..3=1, PWR_STATUS 0x000ffe1f/0x000ffe1f), gate polarity proved (sta g0=0, g1=0, g2=1, g3=0), d180 GPU_ID=0x90930010 L2=0x00120206 MEM=0x00000001 MMU=0x00002830 JS=0x00000007, d181 SHADER_PRESENT=0x00000005/0x00000000; the boot continued with no panic." },
  { kind = "device", reference = "diag158-vendor_boot.img (58920960 bytes, sha256 db34a906c73437aac024c75c915dabedb4a7353faa595ec3b0365661085efaaf) on TB365FC", command = "fastboot flash vendor_boot_a diag158-vendor_boot.img; boot; 1 fps screen capture", revision = "diag158 kernel sha256 5eff61c4ce86906ca5d7ef2e7c093c98a1f38fe08fa035e8fd99afacd8aac41a", result = "The WRITE_VALUE job was submitted on JS0 (cfg=0x00083700, head=tail=0x00100000) but did not start: JOB_INT_RAWSTAT=0, done=0, target unchanged, AS_FAULTSTATUS=0x7c0002cb (READ, slave fault) and the in-memory fault page stayed zero. The early probe lines were lost to the UFS watch burst; no panic." },
  { kind = "device", reference = "diag159-vendor_boot.img (58920960 bytes, sha256 7c7f84a33dd5eb84def8153dcf7a119383f0773dd543c1560bfccc01600a6fec) on TB365FC", command = "fastboot flash vendor_boot_a diag159-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag159 kernel sha256 c8c135f9ee3d78c326475743af9bbbe74c30c039396567e820e630d1cb8145f4", result = "Attempt 1 (Mali LPAE) completed: d2m3 pw l2/sh/tl=1, d2m4 READY=0x00000001/0x00000005/0x00000001, d2m6 mmu idle=1 status=0, d2e2 cfg=0x83700 raw=1, d2e3 done=1 JS_STATUS=0 head=0x100000, d2e4 target=0/0 (was 0xdeadbeefcafef00d), d2e5 fs=0 fa=0, d2e7 GPU fault registers 0, d2ef gpu job ok a=1. The remaining four configurations were skipped; no panic." },
  { kind = "device", reference = "diag160-vendor_boot.img (58920960 bytes, sha256 19972e4bf5f1e441b3c87b261b5e4ee8821b811f6491eab2bf5b1a35f721d45b) on TB365FC", command = "fastboot flash vendor_boot_a diag160-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag160 kernel sha256 c2325b2c6d474b2649c7ccf28adc857468a94944feebf2d17dd82ee4227cec0d", result = "Chain 1 (write-value index 1 -> write-value index 2, dependency 2=1) and chain 2 (no reset, indices 3/4, second target 32 KiB past the JD) both returned c=0: RAWSTAT=0x00010000 (JS0 error), JS_STATUS=0x50, AS_FAULTSTATUS=0, GPU fault registers 0, fault page 0, targets unchanged. The JM rejected the chains before execution; page tables and target mappings were the same ones that worked in diag159." },
  { kind = "analysis", reference = "NativeMali.cpp diag161 matrix audit (2026-11-06)", result = "diag161 printed d2a0 and booted on, but no per-experiment d2a1..d2a5 lines were visible in 1 fps frames 134-180; the console scrolls in bursts, so the output may have been lost. The audit then found a real bug: putJob wrote descriptors at b+(VA-0x100000) while the page table maps VA 0x100000 to pa+0x4000, so JS0 fetched zeroed memory (job type 0) and rejected it. This also explains diag160's JS_STATUS=0x50 chain rejection, since its two chain descriptors used the same helper. diag162 fixes the +0x4000 offset, adds JOB_CHAIN_FLAG (bit 11) and index-base (0/1) variants to the eight-experiment matrix, and repeats a compact d2b/d2c/d2d result block every 8 s so UFS console bursts cannot hide it." },
  { kind = "device", reference = "diag162-vendor_boot.img (58920960 bytes, sha256 08ee8fadbf3f1deae02fd260a505d3583933a7b7d467d9de40b1f612d823d904) on TB365FC", command = "fastboot flash vendor_boot_a diag162-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag162 kernel sha256 2bc77489503937a4b9315e135deec70e633ecc537ef26da96f24260b66049238", result = "The repeating d2b/d2c/d2d block survived the UFS bursts. e1 single WRITE_VALUE completed (D=1 R=0x00000001, T1=0). e6, a two-job chain with the second descriptor page-separated (head 0x100000 next=0x105000, job2 target 0x104000), completed fully (D=1 R=1, T1=0, T3=0, JS_HEAD=0x00105000). e2/e3/e4 (second descriptor at 0x100040, deps variants), e5 (null before a same-page write-value), e7 (JOB_CHAIN_FLAG bit 11) and e8 (index base 0) all failed identically: RAWSTAT=0x00010000, JS_STATUS=0x50, AS_FAULTSTATUS=0, targets unchanged. Chain execution itself works; only same-page +0x40 chaining is rejected as a job-config fault, which points at a descriptor alignment or placement rule. diag163 runs an offset ladder (0x40/0x80/0x100/0x800), a 64-byte offset on a different page, page-separated controls and a single job at +0x40 to pin the rule." },
  { kind = "device", reference = "diag163-vendor_boot.img (58920960 bytes, sha256 e769cb301df4acc5c1b1c96937b3774297e7d1335ac15f57827467015776d178) on TB365FC", command = "fastboot flash vendor_boot_a diag163-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag163 kernel sha256 c64df3c4b00e6558f133654b90bb52ba2b0c6e0f8ac30b2df0afc0eec08a79d7", result = "Placement rule isolated. Passing: e1 single at 0x100000 (D=1 R=1), e3 chain next=0x100080 (both targets zeroed), e4 next=0x100100, e5 next=0x100800, e7 next=0x105000 (JS_HEAD=0x105000, T1=0, T3=0), e8 next=0x106000 (both targets zeroed). Failing with RAWSTAT=0x00010000, JS_STATUS=0x50, AS_FAULTSTATUS=0 and untouched targets: e2 chain next=0x100040, e6 chain next=0x102040 (64-byte offset on another page), and e9 single job at 0x100040. The 0x40 offset fails even without chaining or page sharing, while 0x80/0x100/0x800 pass, so every JM job descriptor, chained or not, must be 128-byte aligned (low 7 bits zero). diag164 validates a four-job aligned chain (0x100000/0x100080/0x100100/0x100180), an aligned cross-page four-job chain, an aligned dependency pair and an aligned write-value-to-null chain before the backend adopts the rule." },
  { kind = "device", reference = "diag164-vendor_boot.img (58920960 bytes, sha256 b4c47f780b838e5192fab2d65779e62ca3be7b279e7a22db785d8472469c8630) on TB365FC", command = "fastboot flash vendor_boot_a diag164-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag164 kernel sha256 85fb8fd3894e7b5d5984b2ea6095a650adc58fbb59559fc08e09bec2cb5f6196", result = "All four aligned-chain experiments passed. e1: four-job contiguous chain at 0x100000/0x100080/0x100100/0x100180 completed (D=1 R=1 S=0) and all four target pages zeroed. e2: the same chain with the fourth descriptor on a separate page (0x107000) also completed (H=0x107000) and zeroed all four targets. e3: aligned two-job chain with dependency 2=1 completed and zeroed both targets. e4: aligned write-value-to-null chain completed and zeroed the write-value target. The 128-byte descriptor alignment rule is confirmed for real multi-job chains, so the backend can adopt it." },
  { kind = "device", reference = "diag165-vendor_boot.img (58920960 bytes, sha256 13553060dfee95893abaebc69dd2d97f5cc37629a426629daf4c8fe407b86ffe) on TB365FC", command = "fastboot flash vendor_boot_a diag165-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag165 kernel sha256 128ddc0ad6d1b3a6071b8dd0767f44fac85082e39c40d0b7659cbd070e6a76b1", result = "Backend-shaped memory layout works. Walk tables now live in their own allocation (L0->L1->L2[1]), buffer A (8 pages) is mapped at VA 0x200000 and buffer B (9 pages) at VA 0x208000. The 16-job chain (descriptors 0x80 apart, job 8 depends on index 1, targets spanning both buffers) completed with D=1 R=1 S=0 and Z=16 - all sixteen target pages zeroed, JS_HEAD=0x200780. A second single-job submission in the same address space, without any reset or MMU reprogramming, also completed (D=1 R=1, Z=1), proving repeated submission works. Multi-buffer VA mapping and long chains are proven from XNU." },
  { kind = "device", reference = "diag166-vendor_boot.img (58920960 bytes, sha256 3837b317bd513da7e8c626f338c2c12209ce84f38299909d072996857181f599) on TB365FC", command = "fastboot flash vendor_boot_a diag166-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag166 kernel sha256 56be93c9704971cf9177157e3997a2042b64d24e8edbb61fd4466b1c1f99b6b1", result = "First backend refactor (MaliAs/MaliBuffer, reusable VA allocator and chain builder). The first 16-job IMMEDIATE_64 chain wrote all sixteen distinct 64-bit values correctly (D=1 R=1 Z=16), proving non-zero payload writes. The second 16-job ZERO chain in the same session only showed Z=8, because that submission path Store-flushed buffer A (descriptors) but not buffer B: dirty CPU target-reset lines were flushed back over the GPU's zeros. diag167 tests the fix and the resubmission path." },
  { kind = "device", reference = "diag167-vendor_boot.img (58920960 bytes, sha256 66a0a0c4c5ea13591ee7256fc5bf7d6220be24435a3e67e92fa1b73b794e25dc) on TB365FC", command = "fastboot flash vendor_boot_a diag167-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag167 kernel sha256 47ca4764778fd333d854c643c8b7d73482b8218573514bf0939842e17fdbcbfa", result = "All three submissions completed with Z=16/16 (immediate read and 100 ms delayed re-read): (1) IMMEDIATE_64 16-job chain after reset, (2) the same chain submitted again in the same address space, (3) a 16-job WRITE_VALUE(ZERO) chain in the same session. Every buffer the CPU writes (descriptors and target resets) must be Store-flushed before the GPU runs, otherwise the post-run flush writes stale dirty lines over GPU results; with that rule, long chains, repeated submission and both write-value types are durable. Cache accounting for the backend is now established." },
  { kind = "device", reference = "diag168-vendor_boot.img (58920960 bytes, sha256 8fee58b1140ca349e1370b8b78c783a3b1086df3db12d21bc571fe566099bcff) on TB365FC", command = "fastboot flash vendor_boot_a diag168-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag168 kernel sha256 e99e2e4c94186a03cecc2bbe2e8fa00748c85b9cc3b44e269ac08e4d45526ae3", result = "Backend core completed. K=0: a write-value job submitted with JS_CONFIG AS=1 (0x83701) against a descriptor and target that exist only in AS1's own walk tables completed (D=1 R=1 S=0) and zeroed its target, proving multi-address-space operation. K=1 and K=2: chains beginning with a CACHE_FLUSH job (type 3, payload selector word 0 and 1) followed by a write-value job both completed (D=1 R=1 S=0) and zeroed the target, so the JM accepts cache-flush jobs and continues the chain; the selector semantics remain to be characterized. MMU, VA allocation, multiple buffers and address spaces, 128-byte chains, dependencies, ZERO/IMMEDIATE_64 write values, cache-flush acceptance, repeated submission and the store-before-submit cache rule are now all device-verified." },
  { kind = "device", reference = "diag169-vendor_boot.img (58920960 bytes, sha256 e3ba28d51933119d2afaa3d1e6ec0d7f27a43aaf90989219db6cbce5678715bd) on TB365FC", command = "fastboot flash vendor_boot_a diag169-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag169 kernel sha256 dcc54431a0cee3ff9046c600b88b6d42f211c2907e538e610028aa2aa364a2a6", result = "The MaliDevice layer passed its self-test (D=1 R=1 S=0, Z=16/16 for both reads): sixteen-job IMMEDIATE_64 chain at fence 1 and a sixteen-job ZERO chain at fence 2, each zeroing/writing all sixteen targets across two BOs. MaliDevice now provides the same semantics the user client will expose - opaque BO handles, explicit VA mapping, device-managed Store/Flush, synchronous submit and a fence counter - modelled on Sheng's Adreno ABI shape." },
  { kind = "device", reference = "diag170-vendor_boot.img (58920960 bytes, sha256 b1c09428c2e8a7b05bdd7fb565296fd553c50959732275f9ac7e8e140d2c7468) on TB365FC", command = "fastboot flash vendor_boot_a diag170-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag170 kernel sha256 1c0fdb1932e154782198aeb73e554e3ae4132c431f3b52f18353f2b07b15f56b", result = "First service image. The late archive needed the same staging as the display classes: NativeMali.o's __GLOBAL__sub_I_NativeMali.cpp had to be globalised (the display probe now calls native_mali_static_init alongside the other two). On device the probe still passed (IMMEDIATE_64 and ZERO both Z=16/16), then NativeMaliService was allocated, its own MaliDevice bring-up returned 1 (d2sv1 mp dev=1) and registerService left the publication pending at the immediate check (d2sv2 mp reg=0 id=0) because registration is asynchronous. diag171 switches to kIOServiceSynchronous." },
  { kind = "device", reference = "diag171-vendor_boot.img (58920960 bytes, sha256 89622f1d40dbed8e884709398342839c3ecb17a7c660409f95984273a0b912fd) on TB365FC", command = "fastboot flash vendor_boot_a diag171-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag171 kernel sha256 387b5b4218afed0fbb6d1fc6eed12e3045ae7a857a691bceaf192715f1538328", result = "Synchronous registerService still left the service outside the plane (d2sv2 mp reg=0 id=0), so the failure was not the asynchronous option: a bare registerService call on a provider-less IOService does not publish it. diag172 uses the sequence that the working display driver uses (attach to a provider, then start)." },
  { kind = "device", reference = "diag172-vendor_boot.img (58920960 bytes, sha256 a431ae0edd5d9c642e45b20eedfe5db1ea0bfea3876a65e47428873712d6dfed) on TB365FC", command = "fastboot flash vendor_boot_a diag172-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag172 kernel sha256 f2f418a9f59fe70a1622e55581d74d17eb40614b0cb7eac1173ca0fabdd52cad", result = "NativeMaliService published. After the probe passed again (both chains Z=16/16), the service attached to IOService::getResourceService() and started (d2sv2 mp a=1 s=1 reg=1 id=0x198888168f), so the Sheng-shaped service object with its MaliDevice, user-client class and versioned fixed-record ABI is now live in the IORegistry on the tablet." },
  { kind = "device", reference = "diag173-vendor_boot.img (58920960 bytes, sha256 9ca92c80e44042c48c951cdc343cd8d90fe9b7e6ef0eb0594070dadbe113592d) on TB365FC", command = "fastboot flash vendor_boot_a diag173-vendor_boot.img; boot; 1 fps screen capture; OCR scan", revision = "diag173 kernel sha256 3a1e9a2676c147683de7bc348ecefb9886351ab76a30293a6ac6a7118d505388", result = "Metal discovery foundation published. The accelerator base audit found the tb365fc IOAcceleratorES vtable at 0xfffffff005d439a0 whose non-deleting destructor 0xfffffff004bd3b64 matches Sheng's recorded baseline, and getMetaClass at 0xfffffff004bd3bac decodes to adrp/add 0xfffffff006aeb688 - exactly the recorded metaclass. The late archive now binds __ZN15IOAcceleratorESC2EPK11OSMetaClass=0x4bd3b20, __ZN15IOAcceleratorESD2Ev=0x4bd3b64 and __ZN15IOAcceleratorES10gMetaClassE=0x6aeb688, defines AGXAccelerator : IOAcceleratorES and publishes it with MetalPluginName=NativeMaliMetal. On device the probe still passed (Z=16/16 both), NativeMaliGPU published (id=0x10000018f) and the AGXAccelerator attached, started and registered (d2sv3 a=1 s=1 reg=1 id=0x100000190) with no panic, and the boot continued normally." },
]

