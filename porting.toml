  { kind = "device", reference = "diag150 vendor_boot (58920960 bytes, sha256 8596476c190815c86cef13b4939c00203aab744129583acba5b15760887986af) display state lines", command = "fastboot flash vendor_boot_a diag150-vendor_boot.img; boot", revision = "5fe891a", result = "d149 lg stg=10 meta=0 init=1 par=1 sz=1a08 rel=0; d150 lg surf=0/1 dt=1 pm=0/4 reg=1; d151 lg xf=0/-1/0 ret=0/0 cl=-1/0; launchd execs=15, no panic in 15 minutes." },
  { kind = "device", reference = "diag151 vendor_boot (58920960 bytes, sha256 ed50d2e4b4040462f8bbf016b1751a57bb56921140ae76c69bba9148693e402e) exec ring", command = "fastboot flash vendor_boot_a diag151-vendor_boot.img; boot", revision = "5fe891a", result = "d152-d154 name fsck, mount, apfs_boot_util, SUEarlyBootTask, cc_fips_test, keybagd, usermanagerd, cfprefsd, logd_helper, aggregated, assistantd, and xpcproxy; execs=141 at 24 minutes; no panic." },
