paths = ["drivers/ShengUfs/**", "package/root-key/**", "scripts/make-tb365fc-root-policy.py", "configs/tb365fc_defconfig"]
inputs = ["The A04RPOL1 owner root policy over the OS/SystemOS windows in userdata.", "The official StaticTrustCache + Cryptex1,SystemTrustCache bundle rebuilt from the target IPSW.", "boot_a with the UEFI FD whose memory map reserves the live device-tree carveouts; vendor_boot_a with the payload carrying the trust bundle.", "An Apple hdiutil-created packed Data seed from the same 21H461 profile (1 GiB logical, volume UUID 44516143-215D-4F9C-902A-7061DB9C292B)."]
configuration = ["CONFIG_XNU_OWNER_ROOT_AUDIT/OWNER_ROOT_TRUST, CONFIG_XNU_OWNER_CACHE_MOUNT/OWNER_CACHE_STARTUP and CONFIG_XNU_OWNER_CACHE_VOLUME_UUID=8846FE78-2910-4297-AF97-D59BB6F8FC16 are enabled.", "The payload trust cache is the rebuilt two-module Apple bundle (sha256 7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7) accepted by the OS profile.", "CONFIG_XNU_OWNER_CACHE_CARRIER=y authorizes the non-union /private/preboot SystemOS cache mount for the shared-region setup; CONFIG_XNU_OWNER_DATA_VOLUME_UUID=44516143-215D-4F9C-902A-7061DB9C292B matches the packed seed (board.toml packed_data_ramdisk=true).", "The bring-up payload adds native-4k-trust-cache=1 to skip the 3.4 GB shared-cache hash pass; the full-hash baseline remains to be re-run."]
procedure = ["Flash boot_a and vendor_boot_a, boot to the bigtext console, and read the d134/d135/d136/d137 probe lines from the console."]
findings = ["The root volume mounts and the SystemOS cryptex mounts read-only and authorizes: d134 cache stage=6 st=0 mnt=0 ro=1 auth=1 rr=1 sel=1000005 mntd=1000005 path=/dev/disk3s1.", "launchd is alive as pid 1 (stat=2 SRUN, flag=0x4004) with no initproc SIGKILL panic during 15 minutes.", "The Apple packed Data seed publishes an APFS volume and mounts read-write: d138 data done stage=4 st=0 ro=0 path=/dev/disk1s1 dev=1000002; d137 writes grow as userland uses /private/var.", "With Data present dyld still failed shared_region_map_and_slide_2_np with errno EPERM (d143 map kr=1): the non-union /private/preboot cache mount is rejected by shared_region_map_and_slide_setup before vm_shared_region_map_file, so the earlier map/slide diagnostics never fired.", "CONFIG_XNU_OWNER_CACHE_CARRIER (offline-owner-cache-carrier.patch) fixes it: the shared region maps, d135 execs grows 1 -> 80, d137 writes reach 23, and no panic occurs in 15 minutes."]
completion = ["Root, SystemOS and Data mount; launchd enters userspace, spawns services (execs=80) and writes /private/var with no initproc panic in 15 minutes."]
limits = ["The legacy display backend is published but no userland client connects yet (display area); there is no HID input, so UI and touch remain unqualified.", "native-4k-trust-cache=1 skips the 3.4 GB shared-cache hash; a full-hash security baseline is still pending.", "Data is a volatile RAM seed; persistence across reboot is not enabled."]
next_action = ["Wire the first userland display client to the legacy display and add HID input, then re-run with the full shared-cache hash as the baseline."]
evidence = [
