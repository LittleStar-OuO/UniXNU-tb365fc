schema_version = 1

[device]
name = "tb365fc"
soc = "MT6835"
os_profile = "ipados-17.7.11-21H461"
summary = "Lenovo Xiaoxin Pad 12.1 (2025), Lenovo TB365FC, board cava_prc_consumer_wifi. The stock ZUXOS 1.1.10.122 package has been unpacked and its boot chain, CPU topology, storage layout and board peripherals are recorded; no hardware milestone is verified yet."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = ["MT6835 platform identity, Lenovo TB365FC (cava_prc_consumer_wifi) board identity, iPad7,1 / iPadOS 17.7.11 build 21H461 target identity and the TB365FC bootstrap defconfig.", "Stock package ZUXOS 1.1.10.122 (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), hashed in proprietary-files.txt."]
configuration = ["board.soc = MT6835; board.soc_source = mt6835; board.os_profile = ipados-17.7.11-21H461; schema_version = 2.", "tb365fc_defconfig enables the shared ARM DT platform, ARMCPU, architected timer, panic and prelinked crypto paths.", "feeds.toml points at the sibling UniXNU-mt6835-common checkout until a reviewed commit is published."]
procedure = ["Run ./unixnu defconfig tb365fc_defconfig -D ../UniXNU-tb365fc from a UniXNU checkout.", "Run ./unixnu status --json -D ../UniXNU-tb365fc and inspect the effective SoC layer and source pins."]
findings = ["The device identifies as MT6835 with stock board name cava_prc_consumer_wifi, Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828.", "The stock SP Flash Tool package provides boot, init_boot, vendor_boot, dtbo, lk and preloader images; their hashes and the values derived from them are recorded across the firmware, cpu, memory, storage, display, input, gpu, network, audio, power and packaging areas.", "No public Lenovo kernel source or DTS for this board was found; every hardware value so far comes from the stock firmware."]
completion = ["Source pins resolve, the effective configuration contains the intended TB365FC overrides and every selected component has an owning area."]
limits = ["DRAM size, the userdata end, the Wi-Fi/BT chip identity and the panel resolution are still unverified; the measured boot geometry has not been accepted by this unit's LK yet."]
next_action = ["Collect the on-device inventory (meminfo, GPT, live FDT) with tools/collect-device-info.sh and replace the remaining REQUIRED values."]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = []
paths = ["proprietary-files.txt", "tools/**", "README.md"]
inputs = ["Stock TB365FC firmware package (Android 15, build TB365FC_CN_OPEN_USER_M1317.3_V_ZUXOS_1.1.10.122_ST_250828), unlocked bootloader state, fastboot mode, the stock boot/vendor_boot/dtbo partitions and the UEFI firmware from uefi-tb365fc.", "Measured boot geometry: boot.img header v4 (4096-byte pages); vendor_boot header v4 with kernel_addr 0x40000000, ramdisk_addr 0x66F00000, tags_addr/dtb_addr 0x47C80000 and cmdline \"bootopt=64S3,32N2,64N2\"."]
configuration = ["Plan A: LK loads a BootShim/UEFI FD directly at 0x40080000 from a self-built header v2 image; Plan B fallback: Linux preboot hot-jump as documented by camellia.", "Resources/Configs/tb365fc.toml derives base, tags_offset, dtb_offset and ramdisk_offset from the stock vendor_boot header; header_version stays 2 because the stock v4 header carries no load addresses.", "Firmware paths in board.toml [firmware] point at Platforms/Lenovo/tb365fcPkg and Build/tb365fcPkg in the uefi-tb365fc checkout."]
procedure = ["Extract the stock boot, vendor_boot and dtbo partitions and read them with tools/unpack_boot_image.py and tools/extract_fdt.py.", "Build the UEFI FD, flash the boot image, and record the first screen, last confirmed stage and log source."]
findings = ["init_boot.img is header v4 with a 2,066,170-byte ramdisk; vendor_boot.img is header v4 with vendor_ramdisk_size 27,731,435 and dtb_size 190,500.", "dtbo.img holds one 240,233-byte DTBO with 208 fragments; the vendor_boot DTB is the MT6835 base tree (model \"MT6835\") and the overlay targets use unresolved 0xffffffff phandles until LK merges them.", "lk.img (2,897,568 bytes) carries kernel_load_addr and dtb_addr as runtime variables rather than text-form constants; the few 32-bit words equal to 0x40080000 have no established role, so the FD base stays the Plan A convention proven on merlinx and camellia until a hardware log confirms it.", "The stock boot images are padded to their partition sizes (boot and vendor_boot 64 MiB, init_boot and dtbo 8 MiB); the hashes in proprietary-files.txt cover the padded files."]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["The stock LK's acceptance of a self-built header v2 image, the FD window at 0x40080000 and the flash method are unverified on hardware."]
next_action = ["Run tools/collect-device-info.sh and compare the live FDT and LK log with the extracted values before the first boot attempt."]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "SHA-256 pins for the stock boot, init_boot, vendor_boot, dtbo, lk and preloader images this area derives its geometry from." },
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Parsed the stock boot, init_boot and vendor_boot headers; produced the header versions, sizes and load addresses recorded above." },
]

[[area]]
id = "cpu"
status = "planned"
components = []
paths = ["dts/**", "configs/**", "patches/**"]
inputs = ["Measured from the stock vendor_boot DTB: 6x Cortex-A55 at MPIDR affinities 0x0-0x500, 2x Cortex-A76 at 0x600-0x700, GIC distributor 0x0C000000 (256 KiB), redistributors 0x0C040000 (2 MiB) and a 13 MHz architected timer."]
configuration = ["CONFIG_XNU_ARMCPU=y and CONFIG_XNU_ARM_DT_PLATFORM=y.", "dts/mt6835.dtsi carries the measured cluster layout, the PSCI conduit and the GIC ranges; tb365fc.dts enables the CPUs."]
procedure = ["Compare dts/mt6835.dtsi with the stock FDT /cpus, interrupt-controller and timer nodes.", "After the first boot, check the PSCI conduit and per-CPU bring-up against /proc/cpuinfo and the stock dmesg."]
findings = ["The stock topology is one GICv3 domain: A55 at affinity 0x0 and 0x100-0x500 (cluster type E), A76 at 0x600/0x700 (cluster type P). The earlier MT6833-style 0x0-0x1 / 0x100-0x105 guess was wrong.", "The architected timer runs at 13 MHz (clock-frequency 0xc65d40), and GICD spans 0x40000 bytes rather than 64 KiB.", "The stock tree has a /psci node (compatible arm,psci-1.0, method smc) and every CPU uses enable-method = \"psci\"; the dtsi conduit matches it.", "The stock tree uses four-cell interrupt specifiers whose trailing cell is a MediaTek wakeup flag; the ADT keeps the standard three-cell GIC form."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["SMP is not enabled on hardware; the PSCI conduit and cluster types are untested."]
next_action = ["Boot the first CPU on hardware, confirm the PSCI conduit, then enable the remaining cores one cluster at a time."]
evidence = []

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**", "tools/**", "patches/**"]
inputs = ["DRAM base and size, reserved-memory carveouts and the IOMMU/SMMU stream inventory.", "The stock tree declares CMA pools (ssmr and ssheap, 256 MiB each, 16 MiB/2 MiB alignment) and dynamic carveouts whose final addresses are assigned by LK."]
configuration = ["tb365fc.dts must expose exactly one enabled memory node with one contiguous range; the shared ADT generator rejects anything else.", "Reserved regions stay outside the contiguous DRAM range reported to XNU."]
procedure = ["Read the stock DTB memory and reserved-memory nodes and reconcile them with /proc/iomem and /proc/meminfo on the rooted device.", "Regenerate the ADT and confirm chosen/dram-base and dram-size match the extracted values."]
findings = ["The stock DTB memory node is a 1 GiB stub at 0x40000000 (0x0 0x40000000 0x0 0x40000000) that LK replaces at boot, so the DRAM size cannot be read from the DTB.", "The 8 GiB / 0x40000000 assumption in tb365fc.dts is still unverified; /proc/meminfo on the tablet is the authority."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The real DRAM size and the final reserved ranges are unknown."]
next_action = ["Read MemTotal and /proc/iomem on the rooted tablet and update the memory node and reserved regions."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the base DTB from the stock vendor_boot image and dumped its memory and reserved-memory nodes." },
]

[[area]]
id = "storage"
status = "planned"
components = []
paths = ["package/**", "patches/**", "tools/**"]
inputs = ["Storage host candidates in the stock DTB: ufshci@112b0000 (\"mediatek,mt8183-ufshci\", reg 0x112b0000/0x2300, IRQ 0x189) is enabled, while mmc@11230000 (\"mediatek,mt6835-mmc\", reg 0x11230000/0x10000 + 0x11e70000/0x1000, IRQ 0x183) and mmc@11240000 are explicitly disabled.", "Stock scatter: boot_a 0x28F00000, vendor_boot_a 0x2CF00000, init_boot_a 0x30F00000, dtbo_a 0x31700000, super 0x4B000000 (0x2C0000000 bytes), userdata at byte 0x34C800000 in both the EMMC and UFS layout.", "The userdata partition geometry and the Data volume UUID."]
configuration = ["[userdata] first_lba = 0x1A64000 and lba_bytes = 512 assume 512-byte sectors; a UFS LUN reporting 4096-byte logical blocks would make the same byte offset LBA 0x34C800. first_lba, last_lba and lba_bytes are REQUIRED until read from the device.", "A storage component is selected only after the host-controller inventory; no storage gate is enabled in tb365fc_defconfig yet."]
procedure = ["Read /proc/partitions, the GPT (sgdisk -p on the boot LUN: /dev/block/sda* for UFS or /dev/block/mmcblk0* for eMMC) and the queue/logical_block_size on the rooted device.", "Record the userdata entry LBA range and the APFS volume UUID used for root matching."]
findings = ["The stock DTB enables a UFS host (ufshci@112b0000) and disables both MSDC hosts; the dtbo also carries the mt6377_vufs rail. The earlier \"eMMC on MSDC_0\" reading came from the scatter's first layout section and is not established.", "The scatter is a download map, not the GPT: its pgpt entry is NONE and the userdata size 0xC0000000 is the factory image, so the real partition may extend further.", "userdata starts at byte 0x34C800000 in both scatter layouts; the logical sector size (512 vs 4096) decides whether that is LBA 0x1A64000 or 0x34C800, so neither value is confirmed."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["The storage type (UFS vs eMMC), the userdata end, the logical block size and the Data volume UUID are unverified; the firmware has no UFS driver or UFS MMIO window, and MsdcDxe is the only storage path."]
next_action = ["Capture /proc/partitions and the block-device queue attributes from the tablet to settle UFS vs eMMC, then set first_lba, last_lba, lba_bytes and root_match_volume_uuid."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Identified the enabled UFS host, the disabled MSDC hosts and their register windows in the stock base DTB." },
]

[[area]]
id = "display"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["DSI panel variant from the stock overlay: panel1@0 \"boe,hx83122b,vdo\" or panel2@1 \"tm,nt36532,vdo\", both video-mode with TE.", "Panel rails and GPIOs: power enable GPIO 0x22, backlight enables 0x15/0x19, reset GPIO 0x56 (86), bias GPIOs 0x7c (124) and 0x97 (151).", "Backlight controllers ST7758 and AW99706 at I2C addresses 0x2e and 0x76 on two panel channels.", "Panel resolution, refresh rate and init sequence from the vendor LCM driver; the device tree carries no timings."]
configuration = ["Bootstrap relies on the firmware GOP framebuffer only; no XNU display provider is selected yet."]
procedure = ["Record the active panel compatible, wm size and wm density on the tablet and match them with the stock LCM driver name from the LK/kernel log.", "Record the GOP mode from the UEFI boot log when the first firmware image runs."]
findings = ["The board ships with either a BOE HX83122B or a Tianma NT36532 video-mode panel using the same rails, reset and TE wiring.", "The touch coordinate space (16000 x 25600) implies a 16:10 panel; the exact resolution and refresh rate are still unverified.", "Backlight is an external ST7758 or AW99706 controller per panel channel, not a PMIC block."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Panel timings, resolution, refresh rate and the active panel variant are unknown."]
next_action = ["Read wm size, wm density and the active LCM driver name on the tablet."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock dtbo overlay that declares both panel variants, their rails and the backlight controllers." },
]

[[area]]
id = "input"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["Touch over SPI at 10 MHz (0x989680) with spi-cpha: IRQ GPIO 4 (active low), reset GPIO 43 (0x2b), dual driver set himax,hxcommon and novatek,NVT-ts-spi, Novatek 40x64 node grid (mp-criteria-6096).", "Pogo keyboard node \"lenovo,lenovo_keyboard\" and MT6377 PMIC keys."]
configuration = ["Input components are selected only after the SPI bus and GPIO inventory; no input gate is enabled yet."]
procedure = ["Read the stock overlay touch/keys nodes and /sys/class/input on the rooted device.", "Record which touch firmware variant the unit actually runs and the pogo keyboard protocol."]
findings = ["Touch is a Himax/Novatek SPI part on IRQ GPIO 4 with reset on GPIO 43.", "A Lenovo pogo keyboard and MT6377 PMIC keys (power, volume) are present."]
completion = ["Touches map to the display, simultaneous contacts keep stable IDs, release events arrive, and buttons produce expected HID reports."]
limits = ["The active touch firmware and the button/keyboard map are unverified."]
next_action = ["Read /sys/class/input and the input device names on the tablet to pin the touch variant and the keyboard protocol."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock overlay touch node with its SPI frequency, GPIOs and driver compatibles." },
]

[[area]]
id = "gpu"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["Valhall GPU at 0x13000000 (\"mediatek,mali\", \"arm,mali-valhall\"), five interrupts 0x10D-0x111 (GPU/MMU/JOB/EVENT/PWR), OPP table and GED supply from the stock base DTB."]
configuration = ["No GPU component is selected; the bootstrap image does not initialize the GPU."]
procedure = ["Record GPU registers, power and clock inputs from the stock DTB before selecting an accelerated frontend."]
findings = ["The stock tree places the GPU at 0x13000000 with GPU/MMU/JOB/EVENT/PWR interrupts and an operating-points table.", "GPU bring-up is deferred until XNU reaches IOKit initialization."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["The GPU model, firmware and IOMMU wiring are only identified by compatible string."]
next_action = ["Inventory the GPU, IOMMU and power domain inputs after the first successful XNU boot."]
evidence = []

[[area]]
id = "network"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**", "proprietary-files.txt"]
inputs = ["MediaTek connsys block: wifi@18000000 (\"mediatek,wifi\", 1 MiB register window, IRQ 0x83, 6 MiB EMI window) and consys@18002000 (\"mediatek,mt6835-consys\") behind the MT6377 connsys power gate.", "Bluetooth firmware connsys_bt.img from the stock package."]
configuration = ["No network component is selected; the bootstrap image has no network stack input."]
procedure = ["Identify the combo chip and firmware variant from the vendor kernel log and /sys/kernel/debug on the tablet, then record hashes in proprietary-files.txt."]
findings = ["Wi-Fi is a MediaTek connsys block at 0x18000000, not an SDIO/PCIe part.", "connsys_bt.img (4,287,968 bytes) embeds the Wi-Fi PHY path phy/6631 and the \"MTK SOC2_2\" connectivity revision, which points at an MT6631-class combo; the exact die still needs the vendor kernel log on the tablet.", "The stock tree names only the SoC block (mediatek,mt6835-consys) behind the MT6377 connsys power gate, so the chip identity comes from the firmware, not the device tree."]
completion = ["Scanning, association, address configuration and sustained receive/transmit traffic pass with the selected firmware."]
limits = ["The exact Wi-Fi/BT die, firmware ABI and MAC provisioning are unverified."]
next_action = ["Read the connsys firmware banner from the vendor kernel log on the tablet to confirm the MT6631 variant."]
evidence = [
  { kind = "source", reference = "proprietary-files.txt", result = "Records the SHA-256 of connsys_bt.img and its source partition." },
]

[[area]]
id = "audio"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**", "proprietary-files.txt"]
inputs = ["MT6377 PMIC codec (\"mediatek,mt6377-sound\") with accessory detection (\"mediatek,mt6377-accdet\").", "Four AW883XX smart amplifiers (\"awinic,aw883xx_smartpa\", I2C 0x34, reset GPIOs 0x20/0x21/0x5c/0x23, sound channels 0-3) on I2S3, plus an alternative Richtek RT5512 speaker amp at I2C 0x5c.", "The DMIC set from the stock overlay."]
configuration = ["No audio component is selected."]
procedure = ["Record the codec/amp wiring and firmware from the stock DTB and vendor files."]
findings = ["The audio path is built around the MT6377 codec with four AW883XX smart amplifiers configured per speaker channel; the skeleton's MT6359 assumption was wrong.", "The stock overlay also declares a Richtek RT5512 speaker amp at 0x5c, so two amplifier variants may exist across board revisions.", "The stock overlay also carries the MT6377 auxadc, gauge and regulator children that feed the audio rails."]
completion = ["Each declared route carries the selected audio format through playback or capture and handles start/stop correctly."]
limits = ["The speaker topology and firmware are not fully inventoried."]
next_action = ["Inventory the codec, amplifiers and DMIC wiring."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock overlay PMIC and codec nodes." },
]

[[area]]
id = "power"
status = "planned"
components = []
paths = ["package/**", "patches/**", "dts/**", "tools/**"]
inputs = ["MT6377 PMIC (bucks, LDOs, charger, gauge, RTC, keys, accdet), MT6685 RTC/clock buffer, the MT6319 external buck (mt6315_3 regulator) and the RT5133 GPIO expander.", "MM8013 fuel gauge, a PPS charger path built on the Southchip SC89890H plus an SGM charger, and the AW35615 USB-PD controller."]
configuration = ["The bootstrap image runs without a battery/charger driver; sleep-disabled defaults stay in place."]
procedure = ["Record PMIC registers, regulator rails and battery thresholds from the stock DTB before writing a power driver."]
findings = ["The PMIC is MT6377, not MT6359; it also provides the MT6377-keys used for the power and volume buttons.", "The stock overlay lists the full regulator set (vbuck1-6, vs1/vs2, vsram, va12/vaud18/vaud28, vaux18, vbif28, vcn33/vcn18, vxo22, vm18, vemc, vio18, vrf rails, vmc, vusb, vmch) and the gauge/RTC/charger children.", "Charging is a PPS path (\"mediatek,charger,pps\") with a two-charger configuration: Southchip SC89890H at I2C 0x6a and an SGM charger at 0x6c, with the AW35615 PD controller at 0x22."]
completion = ["Declared power controls and battery readings match observations; each claimed sleep/resume transition restores its dependent peripherals."]
limits = ["No power driver is written; charger, gauge and RTC register maps are unverified."]
next_action = ["Record the PMIC I2C addresses and the rails the panel, touch and storage depend on."]
evidence = [
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the stock overlay PMIC, regulator and gauge nodes." },
]

[[area]]
id = "packaging"
status = "planned"
components = []
paths = ["package/**", "patches/**", "tools/**", "unixnu.lock"]
inputs = ["The payload image, the boot/vendor_boot layout accepted by the TB365FC LK, the flash method (fastboot flash boot_a) and the partition size limits.", "Stock boot image v4 (no load addresses); stock vendor_boot addresses tags/dtb 0x47C80000 and ramdisk 0x66F00000; partition sizes boot/vendor_boot 64 MiB, dtbo/init_boot 8 MiB."]
configuration = ["Plan A packs the UEFI FD in an Android boot header v2 image at base 0x40000000 with kernel_offset 0x80000 and tags/dtb_offset 0x7C80000; Plan B packs the Linux preboot handoff plus the payload in vendor_boot.", "The payload volume is FAT, labelled TB365FC, 192 MiB."]
procedure = ["Build the payload and boot image, then verify the header fields and offsets against the stock boot image before flashing.", "Record every flash command and the exact image revision."]
findings = ["The stock header is v4 while UniXNU builds v2 so that LK honours kernel_addr = 0x40080000; v2 is proven on merlinx and camellia (same MTK family) but not on this LK yet.", "The stock images are padded to the partition sizes, so image hashes cover the padding as well."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The self-built image has not been accepted by the TB365FC bootloader; the flash path is untested."]
next_action = ["Build the first boot image and compare every header field with Resources/Configs/tb365fc.toml before flashing."]
evidence = [
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Verified the Android boot header fields used to derive the image geometry." },
]

