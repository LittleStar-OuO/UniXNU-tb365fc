[[area]]
id = "packaging"
status = "planned"
components = []
paths = ["package/**", "patches/**", "tools/**", "unixnu.lock"]
inputs = ["The payload image, the boot/vendor_boot layout accepted by the TB365FC LK, the flash method (fastboot flash boot_a) and the partition size limits.", "Stock boot image v4 (no load addresses); stock vendor_boot addresses tags/dtb 0x47C80000 and ramdisk 0x66F00000; partition sizes boot/vendor_boot 64 MiB, dtbo/init_boot 8 MiB."]
configuration = ["Plan A packs gzip(UEFI FD) in an Android boot header v4 image at base 0x40000000 with the 56 MiB FAT payload as the ramdisk; Plan B packs the Linux preboot handoff plus the payload in vendor_boot.", "The payload volume is FAT, labelled TB365FC, 56 MiB, so the image and its padding stay below the 64 MiB boot_a partition and the 64 MiB LK Boot Ramdisk reservation."]
procedure = ["Build the payload and boot image, then verify the header fields and offsets against the stock boot image before flashing.", "Record every flash command and the exact image revision."]
findings = ["Stock and self-built images use header v4. A payload-free v4 image booted from boot_a to the UniXNU menu (diag9); the payload-bearing boot.img built by ./unixnu bootimg keeps that layout (gzip(FD) only, no BootShim, no appended DTB) and is 59,371,520 bytes with a 1584-byte header, a 4096-byte signature slot and the 56 MiB ramdisk; the framework verifier round-trips the kernel gzip and the ramdisk.", "LK places the stock vendor_boot ramdisk at 0x66F00000 inside the Boot Ramdisk reservation; BootRamdiskDxe reads /chosen linux,initrd-start/end and skips a MediaTek ROOTFS header, so a v4 boot ramdisk must land there for DarwinBoot to find the FAT payload.", "The Android iomem view with the stock vendor_boot limits that ramdisk reservation to 0x66f00000-0x68be2fff (the stock 26.4 MiB ramdisk), while the UEFI memory map reserves 64 MiB there; whether LK grows the reservation for the 56 MiB payload must be confirmed on hardware.", "The stock images are padded to the partition sizes, so image hashes cover the padding as well.", "The on-device GPT confirms boot_a and vendor_boot_a are 64 MiB and init_boot_a and dtbo_a 8 MiB, so a self-built boot image must stay below 64 MiB; the init_boot_b entry is 11,776 KiB."]
completion = ["Kernel and prelink succeed, payload contains all declared inputs, and the boot image matches the bootloader format and size limit."]
limits = ["The menu path is proven, but the payload-bearing image and LK's v4 boot ramdisk placement are untested on hardware."]
next_action = ["Flash the payload-bearing image to boot_a with the owner present, capture /proc/pl_lk and console-ramoops, and compare the live initrd range with 0x66F00000."]
evidence = [
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Verified the Android boot header fields used to derive the image geometry." },
  { kind = "device", reference = "tools/pull-stock-images.sh", command = "local GPT parse of adb shell su -c 'dd if=/dev/block/sdc bs=4096 count=34'", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "boot_a and vendor_boot_a are 64 MiB, init_boot_a and dtbo_a 8 MiB, bounding the self-built image sizes." },
]

[[area]]
id = "diagnostics"
status = "planned"
components = []
paths = ["tools/**", "package/tests/**", "package/*Probe*", "unixnu.lock", "README.md"]
inputs = ["adb/fastboot access on the rooted tablet, the stock boot/vendor_boot/dtbo images, serial or pstore log capture, and the UEFI boot log from uefi-tb365fc."]
configuration = ["tools/collect-device-info.sh writes a local, privacy-filtered inventory; tools/unpack_boot_image.py and tools/extract_fdt.py read Android boot images and extract their DTBs.", "The scripts export MSYS_NO_PATHCONV on Git Bash so /dev/block paths reach adb unmangled, and the property filter drops psn and bootloader serial keys."]
procedure = ["Run the collection script over adb and archive the output outside the repository.", "Record the last confirmed boot stage and the matching image revision for every hardware checkpoint."]
findings = ["The stock package was unpacked on the host with the tools in this repository; no UniXNU boot checkpoint exists on this board yet.", "The script ran on the unit after two fixes: MSYS path conversion was rewriting /dev paths (173564d) and the property filter missed psn/bootload_sn (5ba47e6); the clean inventory stays outside the repository because the FDT embeds device-unique data.", "Root came from SukiSU Ultra in LKM mode: adb su works only with SU compat enabled and yields u:r:ksu:s0; the stock kernel has no KernelSU strings.", "fastboot getvar all ran in bootloader mode and reported an unlocked bootloader; the dump stays local because it carries the bootloader serial.", "The pstore partition (sdc19) is zero-filled, but after a reboot /sys/fs/pstore exposes the previous kernel console tail (console-ramoops-0) and /proc/pl_lk exposes the preloader/LK ring; the LK ring is the reliable source for boot-stage facts because wlan traffic overruns the kernel console in about a second."]
completion = ["Each claimed milestone has a reproducible command, a matching source/image revision and an accessible result."]
limits = ["The inventory is a local snapshot; reproducing it needs the scripts at 5ba47e6 or later. The kernel ring buffer keeps only about a second of logs at wlan rates, so kernel-stage evidence needs an immediate post-boot capture; pl_lk and console-ramoops are the retained sources."]
next_action = ["Capture /proc/pl_lk and console-ramoops after every boot change and archive them locally."]
evidence = [
  { kind = "source", reference = "tools/unpack_boot_image.py", result = "Ran against the stock boot, init_boot and vendor_boot images." },
  { kind = "source", reference = "tools/extract_fdt.py", result = "Extracted the base DTB and the DTBO entry from the stock images." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "tools/collect-device-info.sh", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "Produced the clean inventory (identity, meminfo, GPT head, iomem, filtered dmesg, FDT) used across the areas above." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell su -c 'dd if=/dev/block/sdc19 bs=1M count=1 | od -An -tx1'; adb shell su -c 'ls -la /sys/fs/pstore'", revision = "5ba47e6284567baa3450f9d82b5d56963cd14035", result = "pstore partition holds only zeroes; the live console-ramoops files appear only in /sys/fs/pstore after a reboot." },
  { kind = "device", reference = "tools/collect-device-info.sh", command = "adb shell su -c cat /proc/pl_lk; adb shell su -c cat /sys/fs/pstore/console-ramoops-0", revision = "ce3fb214d55f674ef937781e076c8f8f36ed08a5", result = "Captured the LK ring and the previous kernel console tail; the LK ring carries the panel and backlight facts recorded above." },
]

