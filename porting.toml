[[area]]
id = "display-backend"
status = "device-verified"
components = ["GopFramebuffer"]
paths = ["drivers/GopFramebuffer/**", "package/LegacyDisplayProbe.cpp", "scripts/build-display-archive.py", "board.toml", "configs/tb365fc_defconfig"]
inputs = ["The frozen original-class ABI reference (build/xnu-prelink/native-owner-mobile-graphics-candidate.macho and its json) with the QEMU TCG observation of the IOMobileFramebufferLegacy metaclass constructor (x0=0xfffffff006b35940, x2=parent 0xfffffff006b31400, x3=0x18a0).", "The same 21H461 kernelcache with IOMobileGraphicsFamily and IOSurface prelinked from the unchanged roots."]
configuration = ["CONFIG_XNU_NATIVE_LEGACY_DISPLAY=y, CONFIG_XNU_NATIVE_MOBILE_DISPLAY=n; board.toml [kernel] archives ends with build-display-archive.py, whose build-report carries the source hashes the link phase re-checks.", "Payload args offline-mobile-graphics-load=1 offline-mobile-graphics-client=1 offline-legacy-register=1 offline-legacy-phase=4 offline-legacy-gop=1 offline-legacy-unit-scale=2 offline-legacy-pm=1 offline-legacy-validate=1 offline-legacy-transfer=1 offline-legacy-cpu-present=1.", "The archive force-loads NativeLegacyDisplay/NativeGOPPresenter, the official LegacyDisplayProbe and real definitions for the providers this board lacks: the QEMU display probes, a panel vsync source, the MTK DPU scanout hooks and the BootProgress framebuffer claim."]
procedure = ["Flash vendor_boot_a with diag150, boot to the bigtext console and read d149/d150/d151 next to d134-d139."]
findings = ["The original class registers, inits and starts: d149 lg stg=10 meta=0 init=1 par=1 sz=1a08 rel=0.", "IOSurface loads and IOCoreSurfaceRoot is found (surf=0/1); the GOP framebuffer attaches as device_type=display-subsystem under /arm-io (dt=1); registerPowerDriver/changePowerStateToPriv succeed (pm=0/4) and registerService is called once (reg=1).", "No userland process opens the display within 15 minutes: d151 lg xf=0/-1/0 ret=0/0 cl=-1/0 while launchd execs grows to 14-15 and root/SystemOS/Data stay mounted with no panic.", "The exec ring (d152-d154) shows launchd walking the early services: fsck, mount, apfs_boot_util, SUEarlyBootTask, cc_fips_test, keybagd, usermanagerd, cfprefsd, logd_helper, aggregated, assistantd (execs=141 at 24 minutes).", "After about 55 minutes of the same boot, a userland client presents the iPadOS boot screen: the Apple logo appears centred on black on the physical panel, proving the IOMobileFramebufferLegacy client path end to end; the kernel console later repaints over it because the per-256-submit UFS trace keeps scrolling.", "With the trace at every 4096th submit and the watchdog silenced once the client connects, the logo stays on the panel. The bottom line shows SpringBoard exits with SIGABRT (d158 exit pid=130 SpringBoard st=6) and launchd respawns it (pid=245 later), so the display path works while the UI process crash-loops.", "diag153 reaches the same state faster (execs=145 at 27 minutes, logo at about 44 minutes) and shows a later respawn exiting as pid=132 st=6. The signal-time probe d159 never fires: this termination does not go through psignal on the crashing thread, so the abort site must come from the Mach exception reason or the crash report, not from sendsig."]
completion = ["The original IOMobileFramebufferLegacy is published, started and powered on the actual GOP framebuffer of this board."]
limits = ["This tree has no MTK GPU driver, so any presented frame would be a CPU copy through NativeGOPPresenter.", "No client connected, so no swap was exercised and the visible output is still the kernel console."]
next_action = ["Real userland frames now reach the panel (Apple logo and spinner); the remaining blocker is SpringBoard terminating with SIGABRT, so the next area is GPU and Metal per the official GPU page."]
