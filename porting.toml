  { kind = "device", reference = "diag142 vendor_boot (58920960 bytes, sha256 29e0b4aa64326a5f96f6c33e7b2418858871fc9c733722793e1b2c9b8d7fe44c) bigtext console", command = "fastboot flash vendor_boot_a diag142-vendor_boot.img; boot", revision = "c1a98ff", result = "d138 data done stage=4 st=0 ro=0 path=/dev/disk1s1 dev=1000002; launchd execs=1." },
  { kind = "device", reference = "diag145 vendor_boot (58920960 bytes, sha256 db084c3bd851182ca53e7687ecf458ec7a8dbcc229ded70cfb55396e8d04ea79) native-4k-trust-cache fast path", command = "fastboot flash vendor_boot_a diag145-vendor_boot.img; boot", revision = "c1a98ff", result = "The 3.4 GB hash pass is skipped and the same d143 map kr=1 (EPERM) reproduces in about 11 minutes; d145 mapfail/slidefail/mapfile do not fire." },
  { kind = "device", reference = "diag147 vendor_boot (58920960 bytes, sha256 a77dee13335e07a9e5724b983647ae5ee9625c7070d84f2137ce53aa656cd041) carrier build", command = "fastboot flash vendor_boot_a diag147-vendor_boot.img; boot", revision = "c1a98ff", result = "d135 execs=80, d137 rd=85 wr=23, d134 stage=6 path=/dev/disk3s1, d136 stage=4 path=/dev/disk1s1; no panic in 15 minutes." },
